[package]
name = "app"
version = "0.3.0"
description = "A local-first home for your coding agent sessions, local and remote."
authors = ["Mohamed Elashri"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hession"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "json", "blocking"] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "backup"] }
tempfile = "3"
hession-sync = { path = "../crates/hession-sync" }
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
zeroize = "1"
libc = "0.2"

[dev-dependencies]
hession-relay = { path = "../crates/hession-relay" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
axum = "0.8"
