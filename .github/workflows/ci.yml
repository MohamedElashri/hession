name: CI

# Runs the same Makefile targets used locally, on every push to main and on
# pull requests. Releases are built separately by release.yml on version tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relay-container:
    name: Relay container
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment and build relay
        run: |
          mkdir -p deploy/relay/secrets
          openssl rand -hex 32 > deploy/relay/secrets/admin-token
          docker compose -f deploy/relay/compose.yaml config --quiet
          docker build --file deploy/relay/Dockerfile --tag hession-relay:test .

      - name: Install Rust for container integration tests
        uses: dtolnay/rust-toolchain@stable

      - name: Test relay container authentication, persistence, and recovery
        run: |
          cargo test --locked -p hession-relay --test container -- --ignored --nocapture

      - name: Clean up relay container
        if: always()
        run: |
          docker ps --all --quiet --filter label=io.hession.test=relay-container \
            | xargs --no-run-if-empty docker rm --force --volumes
          docker volume ls --quiet --filter label=io.hession.test=relay-container \
            | xargs --no-run-if-empty docker volume rm --force

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same Ubuntu as the Linux release builds.
          - name: Linux
            runner: ubuntu-22.04
            targets: verify
          # The only place the macOS-specific Rust code is compiled before a release.
          - name: macOS
            runner: macos-26
            targets: lint test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: make deps

      - name: Make ${{ matrix.targets }}
        run: make ${{ matrix.targets }}
