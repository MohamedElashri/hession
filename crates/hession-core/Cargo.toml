[package]
name = "hession-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Shared local history services for Hession"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "backup", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "=1.13.1"
tempfile = "=3.27.0"

[build-dependencies]
serde_json = "1"
