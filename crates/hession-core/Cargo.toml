[package]
name = "hession-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Shared local history services for Hession"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
