[package]
name = "hession-sync"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Encrypted portable session records for Hession private sync"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10.1"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
