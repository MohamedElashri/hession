<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="description" content="%BRAND_TAGLINE%" />
    <title>%BRAND_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <style>
      body{margin:0;background:#0d0f12}
      #boot-loading{--boot-bg:#0d0f12;--boot-text:#e8ebef;--boot-muted:#aab1bb;--boot-accent:#a3e27a;--boot-line:#ffffff16;position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:var(--boot-bg);color:var(--boot-text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
      #boot-loading[data-theme="light"]{--boot-bg:#f4f5f7;--boot-text:#15181d;--boot-muted:#4a515b;--boot-accent:#3b7a1c;--boot-line:#0f172a14}
      #boot-loading .boot-card{width:min(100%,360px)}
      #boot-loading .boot-logo{width:64px;height:64px;display:block;margin:0 auto 24px;border-radius:18px;box-shadow:0 12px 40px #0002}
      #boot-loading h1{margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.3px}
      #boot-loading .boot-status{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;color:var(--boot-text);font-size:14px;line-height:1.5}
      #boot-loading .boot-spinner{width:16px;height:16px;border:2px solid var(--boot-line);border-top-color:var(--boot-accent);border-radius:50%;animation:boot-spin 1s linear infinite;flex:none}
      #boot-loading .boot-description{margin:14px 0 0;min-height:42px;color:var(--boot-muted);font-size:13px;line-height:1.6}
      #boot-loading .boot-reload{margin-top:16px;padding:9px 18px;border:1px solid var(--boot-line);border-radius:8px;background:var(--boot-accent);color:var(--boot-bg);font:600 13px system-ui;cursor:pointer}
      #boot-loading .boot-reload:focus-visible{outline:2px solid var(--boot-accent);outline-offset:4px}
      #boot-loading[data-state="error"] .boot-spinner{display:none}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){#boot-loading .boot-spinner{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loading" aria-busy="true">
        <div class="boot-card">
          <img class="boot-logo" src="/logo.svg" alt="" width="64" height="64" />
          <h1>%BRAND_NAME%</h1>
          <div role="status" aria-live="polite" aria-atomic="true">
            <p class="boot-status"><span class="boot-spinner" aria-hidden="true"></span><span id="boot-status">Opening your library…</span></p>
            <p id="boot-description" class="boot-description">Getting everything ready for you.</p>
          </div>
          <button id="boot-reload" class="boot-reload" type="button" hidden>Try again</button>
          <noscript><p>JavaScript is required to open %BRAND_NAME%.</p></noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/startup.js"></script>
  </body>
</html>
